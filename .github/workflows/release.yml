name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
            extension: dylib
            nm_command: nm -gU
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: dylib
            nm_command: nm -gU
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            extension: so
            nm_command: nm -g
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extension: so
            nm_command: nm -g
          - runner: windows-2025
            goos: windows
            goarch: amd64
            extension: dll
            nm_command: go tool nm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "pluginVersion[[:space:]]*=[[:space:]]*\"${version}\"" plugin/main.go

      # v6.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.0"

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Build native plugin
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          mkdir -p dist/stage
          go build -trimpath -buildmode=c-shared \
            -o dist/stage/codex-app-multisession-compat.${{ matrix.extension }} ./plugin
          rm dist/stage/codex-app-multisession-compat.h

      - name: Verify exported CPA ABI
        run: |
          exports="$( ${{ matrix.nm_command }} dist/stage/codex-app-multisession-compat.${{ matrix.extension }} )"
          # A pipe to grep -q can SIGPIPE on the larger Windows symbol table under pipefail.
          grep -Eq '_?cliproxy_plugin_init$' <<< "$exports"
          grep -Eq '_?cliproxyPluginCall$' <<< "$exports"
          grep -Eq '_?cliproxyPluginFree$' <<< "$exports"
          grep -Eq '_?cliproxyPluginShutdown$' <<< "$exports"

      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/stage/codex-app-multisession-compat.${{ matrix.extension }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # v4.6.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: staging
          merge-multiple: false

      - name: Package platform libraries
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
            goos="${platform%-*}"
            goarch="${platform#*-}"
            case "$goos" in
              darwin) extension=dylib ;;
              linux) extension=so ;;
              windows) extension=dll ;;
            esac
            library="codex-app-multisession-compat.${extension}"
            source="staging/release-${platform}/${library}"
            archive="codex-app-multisession-compat_${version}_${goos}_${goarch}.zip"
            test -f "$source"
            (
              cd "staging/release-${platform}"
              zip -q "${GITHUB_WORKSPACE}/dist/${archive}" "$library"
            )
            test "$(unzip -Z1 "dist/${archive}")" = "$library"
          done
          test "$(find dist -maxdepth 1 -name '*.zip' -type f | wc -l | tr -d ' ')" = 5

      - name: Create and validate checksums
        run: |
          (
            cd dist
            shasum -a 256 codex-app-multisession-compat_*.zip > checksums.txt
            shasum -a 256 -c checksums.txt
          )

      - name: Create draft release assets for deployment validation
        # v2.3.4
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/codex-app-multisession-compat_*.zip
            dist/checksums.txt
